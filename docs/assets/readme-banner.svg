      <text x="139" y="303" fill="#DDD6FE" text-anchor="middle">SWISS EPHEMERIS</text>
      <rect x="226" y="282" width="150" height="32" rx="16" fill="#5EEAD4" fill-opacity=".08" stroke="#5EEAD4" stroke-opacity=".25"/>
