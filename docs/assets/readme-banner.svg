<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Smart Studio Astrology MCP</title>
  <desc id="desc">Carta y Arcano. Cálculo astronómico y datos trazables sobre un cielo oscuro con órbitas violetas y turquesas.</desc>
  <defs>
