    <path d="M-148 0H148M0-148V148" stroke="#A78BFA" stroke-opacity=".15"/>
    <path d="M0-28 7-7 28 0 7 7 0 28-7 7-28 0-7-7Z" fill="#DDD6FE" stroke="none"/>
    <circle cx="-117" cy="-71" r="7" fill="#A78BFA" stroke="none"/>
    <circle cx="107" cy="86" r="5" fill="#5EEAD4" stroke="none"/>
    <circle cx="-49" cy="47" r="4" fill="#E2E8F0" stroke="none"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
