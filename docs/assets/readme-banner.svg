    <linearGradient id="orbit" x2="1" y2="1"><stop stop-color="#A78BFA"/><stop offset="1" stop-color="#5EEAD4"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#A78BFA" stop-opacity=".18"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="380" rx="24" fill="url(#background)"/>
  <rect x=".5" y=".5" width="1199" height="379" rx="23.5" stroke="#A78BFA" stroke-opacity=".18"/>
  <circle cx="950" cy="190" r="190" fill="url(#glow)"/>
  <g fill="#CBD5E1" opacity=".5">
    <circle cx="720" cy="55" r="1.5"/><circle cx="1140" cy="78" r="2"/>
    <circle cx="1100" cy="310" r="1.5"/><circle cx="780" cy="320" r="2"/>
    <circle cx="690" cy="267" r="1.5"/><circle cx="1050" cy="37" r="1"/>
    <circle cx="1160" cy="228" r="1"/><circle cx="840" cy="66" r="1"/>
  </g>
  <g transform="translate(950 190)" stroke="url(#orbit)">
