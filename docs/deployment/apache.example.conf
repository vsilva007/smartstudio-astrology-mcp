# Plantilla: completar certificados y activar módulos proxy/proxy_http/ssl/headers fuera de estos scripts.
<VirtualHost *:443>
    ServerName mcp.smartstudio.dev
    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/mcp.smartstudio.dev/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mcp.smartstudio.dev/privkey.pem
    ProxyPreserveHost On
    ProxyTimeout 30
    LimitRequestBody 32768
    ProxyPass / http://127.0.0.1:4100/ connectiontimeout=3 timeout=30
    ProxyPassReverse / http://127.0.0.1:4100/
</VirtualHost>
<VirtualHost *:443>
    ServerName mcp-demo.smartstudio.dev
    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/mcp-demo.smartstudio.dev/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mcp-demo.smartstudio.dev/privkey.pem
    ProxyPreserveHost On
    ProxyTimeout 30
    LimitRequestBody 32768
    Header always set X-Robots-Tag "noindex, nofollow, noarchive"
    ProxyPass / http://127.0.0.1:4200/ connectiontimeout=3 timeout=30
    ProxyPassReverse / http://127.0.0.1:4200/
</VirtualHost>
